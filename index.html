<!doctype html>
<html lang="en" data-default-look="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FCF6EE">
<meta name="description" content="Point your camera at clothes or shoes. Summu names the piece, looks up what it sells for, and saves it as a card.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Summu">
<meta property="og:title" content="Summu: what are your clothes worth?">
<meta property="og:description" content="Point your camera at clothes or shoes. Summu names the piece, finds what it sells for, and turns it into a card.">
<meta property="og:url" content="https://emecarton.github.io/summu./">
<meta property="og:image" content="https://emecarton.github.io/summu./og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Summu trading cards for clothes">
<meta name="twitter:card" content="summary_large_image">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Summu">
<title>Summu</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preload" href="fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&display=swap">
<style>
/* Layout: a phone-sized app that opens on the camera. Five tabs (Spots, Dex, Scan, Ranks, Me) with the shutter in the middle; the camera fills the phone on the Scan tab and the other tabs scroll above the tab bar. Dark by default, light look in Me. */
:root{
  --ground:#ECE9E4; --ground-ink:#1C1C1B; --ground-muted:#6B6760;
  --display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body:system-ui, -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){ --ground:#0E0E0E; --ground-ink:#F2EFEA; --ground-muted:#A19D96; color-scheme:dark; }}
:root[data-theme="dark"]{ --ground:#0E0E0E; --ground-ink:#F2EFEA; --ground-muted:#A19D96; color-scheme:dark; }
.phone{
  --bg:#121212; --surface:#1C1C1B; --raise:#262625; --ink:#F2EFEA; --muted:#A19D96; --line:#2F2E2C; --soft:#20201F;
  --accent:#F2EFEA; --accent-ink:#121212; --fire:#FF5A2E; --safe:#3CC48D; --lav:#F2EFEA;
  --basic:#8E8A84; --common:#3CC48D; --rare:#3AA8F0; --epic:#A97BFF; --grail:#FFB23E;
  --r:6px; --r-lg:10px; color-scheme:dark;
}
.phone[data-look="light"]{
  --bg:#F6F4F0; --surface:#FFFFFF; --raise:#ECE9E4; --ink:#1C1C1B; --muted:#6B6760; --line:#DEDAD3; --soft:#ECE9E4;
  --accent:#121212; --accent-ink:#FFFFFF; --safe:#1F9D6B; --lav:#121212;
  --basic:#8E8A84; --common:#1F9D6B; --rare:#2C93D8; --epic:#7A3CFF; --grail:#D9861A; color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.screen,.carousel,.sheet-body,.onb-body,.seg{scrollbar-width:none;overscroll-behavior:contain}
.screen::-webkit-scrollbar,.carousel::-webkit-scrollbar,.sheet-body::-webkit-scrollbar,.onb-body::-webkit-scrollbar,.seg::-webkit-scrollbar{display:none}
html,body{height:100%}
body{background:var(--ground);color:var(--ground-ink);font-family:var(--body);font-size:15px;line-height:1.4;padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px;margin:0}
.note{max-width:390px;width:100%;font-size:13px;color:var(--ground-muted);text-align:center;text-wrap:balance;margin:0}
.note b{color:var(--ground-ink)}
.phone{position:relative;width:100%;max-width:390px;height:min(860px,100%);min-height:560px;background:var(--bg);color:var(--ink);border-radius:32px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 60px -28px rgba(30,10,50,.55)}
@media (max-width:520px){body{padding:0;gap:0}.phone{border-radius:0;height:100%;min-height:0;max-width:none;box-shadow:none}}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,label:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;text-transform:uppercase;letter-spacing:.01em;line-height:.92;text-wrap:balance}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:0;top:0}

/* Tabs */
.screen{flex:1;overflow-y:auto;padding:0 16px 24px;min-height:0;position:relative}
.tabs{position:relative;z-index:5;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;border-top:1px solid var(--line);background:var(--bg);padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:700;letter-spacing:.02em;color:var(--muted);padding:4px 0}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{stroke-width:2.5}
.tab.scan svg{color:var(--fire)}
.phone[data-tab="scan"] .screen{display:none}
.phone[data-tab="scan"] .tabs{background:#0B0B0B;border-top-color:#0B0B0B}
.phone[data-tab="scan"] .tab{color:rgba(255,255,255,.6)}
.phone[data-tab="scan"] .tab[aria-current="page"]{color:#fff}

/* Camera: viewfinder on top, one control row under it, tabs below. Nothing overlaps the shutter. */
.cam{display:none;position:relative;flex:1;min-height:0;background:#0B0B0B;color:#fff;grid-template-rows:minmax(0,1fr) auto}
.phone[data-tab="scan"] .cam{display:grid}
.vf{position:relative;overflow:hidden;min-height:0;background:#000;border-radius:0 0 22px 22px}
.vf video,.vf .still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vf .still{z-index:1}
.vf.drop::after{content:"Drop the photo to scan it";position:absolute;inset:12px;z-index:6;border:2px dashed #fff;border-radius:10px;display:grid;place-items:center;background:rgba(11,8,15,.7);font-weight:800}
.cam-top{position:absolute;left:0;right:0;top:0;z-index:4;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:linear-gradient(to bottom,rgba(8,8,8,.65),rgba(8,8,8,0))}
.logo{font-family:var(--display);font-weight:900;font-size:28px;letter-spacing:.02em;line-height:1;text-transform:uppercase}
.logo span{color:var(--fire)}
.ptspill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:rgba(18,18,18,.6);backdrop-filter:blur(8px);font-weight:800;font-size:13px;color:#fff}
.ptspill b{font-family:var(--display);font-size:18px;letter-spacing:.02em}
/* Frame corners sit inside the viewfinder, below the top bar */
.frame{position:absolute;top:64px;left:18px;right:18px;bottom:18px;z-index:2;pointer-events:none}
.frame .c{position:absolute;width:34px;height:34px;border:3px solid #fff;opacity:.92}
.frame .a{left:0;top:0;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
.frame .b{right:0;top:0;border-left:0;border-bottom:0;border-radius:0 14px 0 0}
.frame .d{left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 14px}
.frame .e{right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 14px 0}
.vf-msg{position:absolute;left:30px;right:30px;bottom:34px;z-index:3;display:flex;justify-content:center;pointer-events:none}
.vf-msg>*{pointer-events:auto}
.pillmsg{font-size:13px;font-weight:700;padding:7px 13px;border-radius:999px;background:rgba(18,18,18,.62);backdrop-filter:blur(8px);text-align:center}
/* When the page can't show a live camera: what to do, plus three pieces to hunt */
.nolive{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:70px 28px 22px;text-align:center;background:radial-gradient(120% 60% at 50% 0%,#1D1626,#0B0B0B 72%)}
.nolive h2{font-size:40px;color:#fff}
.nolive h2 span{color:var(--fire)}
.nolive p{margin:0;color:rgba(255,255,255,.72);font-size:14px;max-width:300px;text-wrap:balance}
.targets{width:100%;max-width:320px;display:flex;flex-direction:column;gap:8px;margin-top:4px}
.targets>small{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.targets .row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.targets button{background:#1A1A1A;border-radius:8px;padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff}
.targets img{width:100%;aspect-ratio:1;object-fit:contain;filter:brightness(0) invert(.18)}
.targets b{font-family:var(--display);font-size:17px;font-weight:900;line-height:1}
.targets i{font-style:normal;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.statusbox{width:100%;max-width:320px;background:#1A1A1A;border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:13px;color:rgba(255,255,255,.85);text-align:left}
.statusbox b{color:#fff}
.statusbox .acts{display:flex;gap:8px;flex-wrap:wrap}
.statusbox button{padding:8px 12px;border-radius:999px;background:#fff;color:#121212;font-weight:800;font-size:13px}
.statusbox button.alt{background:rgba(255,255,255,.12);color:#fff}
.scanning{position:absolute;inset:0;z-index:3;pointer-events:none}
.scanning .line{position:absolute;left:0;right:0;height:3px;background:var(--fire);box-shadow:0 0 22px 6px rgba(255,90,46,.55);animation:scanline 1.5s ease-in-out infinite alternate}
@keyframes scanline{from{top:14%}to{top:86%}}
.scanning .chip{position:absolute;left:50%;top:64px;transform:translateX(-50%);pointer-events:auto;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 14px;border-radius:999px;background:rgba(18,18,18,.78);backdrop-filter:blur(8px);font-weight:800;font-size:14px;white-space:nowrap}
.scanning .chip button{padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.14);font-size:12px;font-weight:800}
/* One control row: Upload, shutter, Spots */
.controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 22px 10px}
.side{display:flex;flex-direction:column;align-items:center;gap:5px;color:rgba(255,255,255,.85);font-size:11px;font-weight:700;cursor:pointer;justify-self:start;min-width:56px}
#lastspot{justify-self:end}
.side .ico{width:48px;height:48px;border-radius:8px;background:#222222;display:grid;place-items:center;overflow:hidden;color:#fff}
.side .ico .crop{width:100%;height:100%;background:#222222}
.shutter{width:76px;height:76px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center;background:transparent}
.shutter span{width:60px;height:60px;border-radius:50%;background:#fff;transition:transform .12s}
.shutter:active span{transform:scale(.88)}
.shutter.busy span{background:var(--fire);animation:pulse 1s ease-in-out infinite}
.shutter.off{border-color:rgba(255,255,255,.45)}
.shutter.off span{background:rgba(255,255,255,.45)}
@keyframes pulse{50%{transform:scale(.8)}}

/* Shared */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:18px 0 6px}
.top h1{font-size:46px}
.top h1 span{color:var(--fire)}
.top small{color:var(--muted);font-size:12px;font-weight:700;padding-bottom:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;padding:12px 16px;border-radius:var(--r);font-weight:800;font-size:15px;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.hot{background:var(--fire);color:#fff}
.btn.block{width:100%}
.btn:disabled{opacity:.4}
.btn svg.i{width:19px;height:19px}
a.btn{text-decoration:none}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-family:var(--display);font-size:24px;font-weight:800;text-transform:uppercase;line-height:1;margin:24px 0 12px}
.section-title small{font-family:var(--body);font-size:12px;font-weight:600;color:var(--muted);text-transform:none}
.brand{font-family:var(--display);font-size:15px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;line-height:1.05}
.empty{text-align:center;color:var(--muted);padding:22px 10px;font-size:13px}
.emptybox{display:flex;flex-direction:column;gap:10px;text-align:center;padding:26px 16px;border:1.5px dashed var(--line);border-radius:var(--r-lg);color:var(--muted);font-size:14px;margin:8px 0 16px}
.emptybox b{color:var(--ink);font-family:var(--display);font-size:26px;text-transform:uppercase;line-height:1}
.banner{margin:12px 0 0;padding:10px 12px;border-radius:var(--r);background:color-mix(in oklab,var(--fire) 16%,var(--surface));font-size:13px}
.info{display:flex;gap:10px;align-items:flex-start;font-size:13px;padding:11px 12px;border-radius:var(--r);background:var(--soft);color:var(--ink)}
.info>span:first-child{color:var(--safe);display:grid}
.info svg.i{width:18px;height:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 4px}
.stats div{background:var(--surface);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;min-width:0}
.stats b{font-family:var(--display);font-size:28px;line-height:1;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats small{color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.rar{display:inline-flex;align-items:center;font-family:var(--display);font-size:14px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;padding:1px 8px;border-radius:4px;background:var(--c);color:#121212;width:max-content}
.tagnew{font-family:var(--display);font-size:14px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;padding:1px 8px;border-radius:4px;background:#fff;color:#121212}
.crop{position:relative;overflow:hidden;aspect-ratio:1;background:var(--soft)}
.crop img{position:absolute;display:block;max-width:none}
.toast{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:700;font-size:13px;padding:10px 14px;border-radius:var(--r);z-index:40;white-space:nowrap;animation:up .2s ease-out}
.loading{display:grid;place-items:center;min-height:60%;color:var(--muted)}

/* Spots */
.spots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.spot{position:relative;border-radius:var(--r-lg);overflow:hidden;background:var(--surface);text-align:left;display:flex;flex-direction:column;border:2px solid var(--c)}
.spot .crop{border-radius:0}
.spot .t{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.spot .t .brand{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spot .t small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spot .val{font-family:var(--display);font-size:22px;font-weight:900;line-height:1}
.spot .rar{position:absolute;left:8px;top:8px}
.spot .n{position:absolute;right:8px;top:8px;font-size:11px;font-weight:800;background:rgba(20,16,25,.75);color:#fff;border-radius:4px;padding:1px 6px}

/* Reveal card */
.reveal{position:relative;border-radius:10px;padding:14px;background:linear-gradient(165deg,color-mix(in oklab,var(--c) 55%,#121212),#121212 72%);color:#fff;display:flex;flex-direction:column;gap:10px;box-shadow:0 0 0 2px var(--c),0 18px 40px -16px var(--c);animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85) rotate(-2deg);opacity:0}}
.reveal .row1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.reveal .row1 .tags{display:flex;gap:6px}
.reveal .crop{border-radius:8px;background:#262625}
.reveal .rv-brand{font-family:var(--display);font-size:34px;font-weight:900;text-transform:uppercase;line-height:.9}
.reveal .rv-name{font-size:16px;font-weight:700}
.reveal .rv-val{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.reveal .rv-val b{font-family:var(--display);font-size:44px;font-weight:900;line-height:.9}
.reveal .rv-val small{font-size:12px;color:rgba(255,255,255,.75)}
.reveal .rv-pts{display:flex;align-items:center;justify-content:space-between;padding-top:8px;border-top:1px solid rgba(255,255,255,.15);font-weight:800}
.reveal .rv-pts b{font-family:var(--display);font-size:28px;color:var(--c)}
.reveal .rv-line{font-size:13px;color:rgba(255,255,255,.8);font-style:italic}
.reveal .rv-tags{display:flex;gap:6px;flex-wrap:wrap}
.reveal .rv-tags span{font-size:11px;font-weight:800;padding:2px 7px;border-radius:4px;background:rgba(255,255,255,.14)}
.item{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:var(--surface);border-radius:var(--r-lg);padding:8px;border-left:4px solid var(--c)}
.item .crop{border-radius:var(--r)}
.item .t{min-width:0;display:flex;flex-direction:column;gap:2px}
.item .t .nm{font-size:14px;font-weight:700;line-height:1.2}
.item .t small{color:var(--muted);font-size:12px}
.item .p{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.item .p b{font-family:var(--display);font-size:20px;font-weight:900;line-height:1}
.item .p small{font-size:11px;font-weight:800;color:var(--muted)}
.items{display:flex;flex-direction:column;gap:8px}
.photo{position:relative;border-radius:var(--r-lg);overflow:hidden;background:var(--soft)}
.photo img{width:100%;display:block}
.photo .dot{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:#fff;color:#121212;font-weight:900;font-size:13px;display:grid;place-items:center;box-shadow:0 0 0 4px rgba(255,255,255,.3)}

/* Dex */
.prog{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--fire)}
.dexhead{background:var(--surface);border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:10px;margin-top:6px}
.dexhead .nums{display:flex;justify-content:space-between;align-items:baseline}
.dexhead .nums b{font-family:var(--display);font-size:34px;font-weight:900;line-height:1}
.dexhead .nums small{color:var(--muted);font-weight:700;font-size:12px}
.carousel{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 6px;scroll-snap-type:x mandatory;scroll-padding-inline:16px}
.want{flex:none;width:128px;scroll-snap-align:start;text-align:left;display:flex;flex-direction:column;gap:3px}
.sil{position:relative;aspect-ratio:1;border-radius:var(--r);background:var(--surface);display:grid;place-items:center;overflow:hidden}
.sil img{width:82%;height:82%;object-fit:contain}
.sil.off img{filter:brightness(0) opacity(.75)}
.phone[data-look="light"] .sil.off img{filter:brightness(0) opacity(.55)}
.sil.on{background:color-mix(in oklab,var(--c,var(--accent)) 18%,var(--surface))}
.sil .q{position:absolute;inset:auto 0 6px 0;text-align:center;font-family:var(--display);font-weight:900;font-size:16px;color:var(--muted)}
.sil .ok{position:absolute;right:6px;top:6px;width:20px;height:20px;border-radius:50%;background:var(--safe);color:#fff;display:grid;place-items:center}
.sil .ok svg.i{width:13px;height:13px;stroke-width:3}
.want small,.dexp small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.want b,.dexp b{font-family:var(--display);font-size:18px;font-weight:900}
.brands{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bcard{background:var(--surface);border-radius:var(--r-lg);padding:10px;display:flex;flex-direction:column;gap:8px;text-align:left}
.bcard .peek{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.bcard .peek .sil{border-radius:6px;background:var(--soft)}
.bcard .row{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.bcard .row small{color:var(--muted);font-size:12px;font-weight:700;white-space:nowrap}
.bcard .brand{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dexgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 8px}
.dexp{display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left}
.dexp .nm{font-size:12px;font-weight:700;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* Ranks */
.ranks{display:flex;flex-direction:column;gap:8px}
.rk{display:grid;grid-template-columns:34px 40px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:var(--r-lg);background:var(--surface)}
.rk.me{box-shadow:inset 0 0 0 2px var(--accent)}
.rk .pos{font-family:var(--display);font-size:24px;font-weight:900;text-align:center;color:var(--muted)}
.rk:nth-child(1) .pos{color:var(--grail)}
.rk .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:20px;color:#fff;text-transform:uppercase}
.rk .t{min-width:0;display:flex;flex-direction:column}
.rk .t b{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .t small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .pts{font-family:var(--display);font-size:24px;font-weight:900;text-align:right;line-height:1}
.rk .pts small{display:block;font-family:var(--body);font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase}

/* Me */
.profile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 0 6px;text-align:center}
.profile .av{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:38px;color:#fff;text-transform:uppercase}
.profile h2{font-size:32px}
.lvl{width:100%;background:var(--surface);border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:8px;margin-top:8px}
.lvl .row{display:flex;justify-content:space-between;align-items:baseline}
.lvl .row b{font-family:var(--display);font-size:28px;font-weight:900}
.lvl .row small{color:var(--muted);font-size:12px;font-weight:700}
.tiers{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tiers div{background:var(--surface);border-radius:var(--r);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;border-top:3px solid var(--c)}
.tiers b{font-family:var(--display);font-size:24px;font-weight:900;line-height:1}
.tiers small{font-size:10px;font-weight:800;text-transform:uppercase;color:var(--muted)}
.setting{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.setting .t{flex:1;min-width:0}
.setting small{display:block;color:var(--muted);font-size:12px}
.switch{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--safe)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}
.lock{font-size:11px;font-weight:700;color:var(--safe)}
.seg{display:flex;gap:6px;overflow-x:auto}
.chip{flex:none;padding:8px 14px;border-radius:var(--r);background:var(--soft);font-size:14px;font-weight:700;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* Sheets */
.scrim{position:absolute;inset:0;background:rgba(8,5,12,.6);z-index:20}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;background:var(--bg);border-radius:12px 12px 0 0;z-index:21;display:flex;flex-direction:column;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 16px 8px}
.sheet-head h3{font-size:26px;min-width:0}
.sheet-body{overflow-y:auto;padding:4px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;min-height:0}
.sheet-body>*{flex-shrink:0}
.x{width:34px;height:34px;border-radius:50%;background:var(--soft);font-size:18px;flex:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.danger{color:var(--fire)}

/* Welcome */
.onb{position:absolute;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}

.onb-body{flex:1;overflow-y:auto;padding:28px 20px 16px;display:flex;flex-direction:column;gap:16px;min-height:0}
.onb-body>*{flex-shrink:0}
.wordmark{font-family:var(--display);font-weight:900;font-size:84px;line-height:.82;text-transform:uppercase}
.wordmark span{color:var(--fire)}
.onb-body h2{font-size:40px}
.onb-body p{margin:0;color:var(--muted)}
.how{display:flex;flex-direction:column;gap:10px}
.how div{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;background:var(--surface);border-radius:var(--r-lg);padding:10px 12px}
.how i{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;background:var(--soft);font-style:normal}
.how b{display:block}
.how small{color:var(--muted)}
.tierline{display:flex;gap:6px;flex-wrap:wrap}
.onb-foot{padding:12px 20px calc(18px + env(safe-area-inset-bottom,0px))}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.pill svg.i{width:14px;height:14px}
.link{font-size:13px;font-weight:800;color:var(--accent);padding:2px 0;text-decoration:underline}
.grp{font-weight:800;font-size:14px;margin-top:4px}
.pts-table{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r-lg);padding:4px 12px}
.pts-table div{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.pts-table div:last-child{border-bottom:0}
.pts-table b{font-family:var(--display);font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{padding:5px 10px;border-radius:6px;background:var(--surface);font-size:13px;font-weight:700}
.bigsil{aspect-ratio:1;border-radius:var(--r-lg);background:var(--surface);display:grid;place-items:center;overflow:hidden}
.bigsil img{width:80%;height:80%;object-fit:contain}
.bigsil.off img{filter:brightness(0) opacity(.75)}
.bigsil.photo img{width:100%;height:100%;object-fit:cover}
.kv{display:flex;flex-wrap:wrap;gap:6px}
.kv>span:not(.rar){font-size:12px;padding:5px 9px;border-radius:6px;background:var(--soft)}
[hidden]{display:none!important}
.cam-note:not(:empty){left:36px;right:36px;padding:8px 12px;border-radius:8px;background:rgba(18,18,18,.62);backdrop-filter:blur(8px);color:#fff}

/* Website: full screen on phones, a phone-sized frame on computers. Four tabs, and room for the notch when added to the home screen. */
html,body{height:100%}
@supports (height:100dvh){body{height:100dvh}}
@media (max-width:520px){html,body{overflow:hidden;overscroll-behavior:none}}
.tabs{grid-template-columns:repeat(4,1fr)}
.cam-top{padding-top:calc(14px + env(safe-area-inset-top,0px))}
.frame,.scanning .chip{top:calc(64px + env(safe-area-inset-top,0px))}
.screen{padding-top:env(safe-area-inset-top,0px)}
.onb-body{padding-top:calc(28px + env(safe-area-inset-top,0px))}
.nolive{padding-top:calc(66px + env(safe-area-inset-top,0px));overflow-y:auto;justify-content:safe center}
/* Before the camera is on: what Summu needs and one button */
.camask{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:320px}
.camask .big{width:68px;height:68px;border-radius:50%;background:rgba(255,90,46,.16);color:var(--fire);display:grid;place-items:center}
.camask .big svg{width:32px;height:32px}
.camask .btn{width:100%;cursor:pointer}
.camask .alt{font-size:13px;font-weight:700;color:rgba(255,255,255,.78);text-decoration:underline;cursor:pointer;padding:4px 8px}
/* Claude key sheet */
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.field input{width:100%;padding:12px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:16px;font-weight:600}
.field input:focus{border-color:var(--accent);outline:none}
.err{color:var(--fire);font-size:13px;font-weight:700}
.fine{margin:0;color:var(--muted);font-size:12px}
.profile .av svg{width:38px;height:38px;color:#fff}

/* Card game: 7 rarity tiers, minted cards, Vault, Hunts, trophies. Five tabs: Vault, Dex, Scan, Hunts, Me. */
.phone{--common:#A8A49E;--uncommon:#3CC48D;--rare:#3AA8F0;--epic:#A97BFF;--legendary:#FFB23E;--mythic:#FF5277;--grail:#FFE29A}
.phone[data-look="light"]{--common:#7A766F;--uncommon:#1F9D6B;--rare:#2C93D8;--epic:#7A3CFF;--legendary:#D9861A;--mythic:#E0335C;--grail:#B8892A}
.phone[data-look="light"] .rar{color:#fff}
.phone[data-look="light"] .rar[style*="grail"],.phone[data-look="light"] .rar[style*="legendary"]{color:#1C1C1B}
.tabs{grid-template-columns:repeat(5,1fr)}
.tab{position:relative}
.tab .dot{position:absolute;top:2px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--fire);box-shadow:0 0 0 2px var(--bg)}
.muted{color:var(--muted)}
.stats b.tname{font-size:21px;line-height:28px;text-transform:uppercase}
.ptspill b{margin:0 1px}

/* The card. Sizes are in em so one design scales from the big reveal to the small Vault grid. */
.card{--common:#A8A49E;--uncommon:#3CC48D;--rare:#3AA8F0;--epic:#A97BFF;--legendary:#FFB23E;--mythic:#FF5277;--grail:#FFE29A;
  position:relative;display:block;width:100%;border-radius:1.1em;padding:.42em;color:#fff;text-align:left;isolation:isolate;overflow:hidden;
  background:linear-gradient(155deg,color-mix(in srgb,var(--c) 72%,#fff),color-mix(in srgb,var(--c) 62%,#000) 55%,color-mix(in srgb,var(--c) 85%,#fff));
  box-shadow:0 .9em 1.8em -.9em color-mix(in srgb,var(--c) 75%,transparent),0 0 0 1px rgba(0,0,0,.35)}
.card-in{position:relative;border-radius:.78em;padding:.62em .62em .55em;display:flex;flex-direction:column;gap:.5em;
  background:radial-gradient(130% 75% at 50% 22%,color-mix(in srgb,var(--c) 28%,#161616),#0B0B0B 78%)}
.card-top{display:flex;justify-content:space-between;align-items:baseline;gap:.5em;font-family:var(--display);font-weight:900;text-transform:uppercase;letter-spacing:.06em;line-height:1}
.card-top .tier{color:var(--c);font-size:1.3em}
.card-top .no{color:rgba(255,255,255,.62);font-size:1em}
.art{position:relative;aspect-ratio:1;border-radius:.6em;overflow:hidden;background:#000;box-shadow:0 0 0 .16em color-mix(in srgb,var(--c) 80%,transparent)}
.art .crop{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;background:#000}
.art img{filter:contrast(1.08) saturate(1.12)}
.art::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(85% 85% at 50% 42%,transparent 55%,rgba(0,0,0,.5)),linear-gradient(180deg,rgba(255,255,255,.14),transparent 32%)}
.card-name{min-width:0}
.card-name b{display:block;font-family:var(--display);font-weight:900;font-size:1.7em;line-height:.95;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-name span{display:block;margin-top:.25em;font-size:.86em;font-weight:600;color:rgba(255,255,255,.78);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-stats{display:grid;grid-template-columns:1fr .9fr 1.25fr;gap:.35em}
.card-stats span{display:flex;flex-direction:column;min-width:0;padding:.38em .5em;border-radius:.5em;background:rgba(255,255,255,.08)}
.card-stats small{font-size:.6em;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.card-stats b{font-family:var(--display);font-weight:900;font-size:1.12em;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-foot{display:flex;justify-content:space-between;align-items:baseline;gap:.5em;font-size:.68em;font-weight:700;color:rgba(255,255,255,.55)}
.card-foot span:first-child{font-family:var(--display);font-weight:900;font-size:1.45em;color:#fff;text-transform:uppercase;letter-spacing:.04em}
.card-foot i{font-style:normal;color:var(--fire)}
/* Small cards in grids: value only */
.card.mini{font-size:9px}
.card.mini .card-stats{grid-template-columns:1fr}
.card.mini .card-stats span:not(:first-child),.card.mini .card-foot{display:none}
.card.mini .card-stats span{flex-direction:row;justify-content:space-between;align-items:baseline}
/* Foil from Epic up; stronger for Legendary and Mythic; Grail gets a moving rainbow frame */
.card .holo,.card .glare{position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:inherit}
.card .holo{background:linear-gradient(115deg,transparent 22%,rgba(255,0,200,.55) 36%,rgba(0,220,255,.55) 47%,rgba(255,240,0,.5) 58%,transparent 72%);background-size:260% 260%;background-position:30% 30%;mix-blend-mode:color-dodge;opacity:.22}
.card .glare{background:radial-gradient(circle at var(--mx,28%) var(--my,18%),rgba(255,255,255,.38),transparent 48%);mix-blend-mode:overlay;opacity:.75}
.t-legendary .holo,.t-mythic .holo{opacity:.34}
.t-grail{background:linear-gradient(135deg,#FFE29A,#FF9AD5 25%,#9AD0FF 50%,#B8FFCF 75%,#FFE29A);background-size:300% 300%}
.t-grail .holo{opacity:.45}
.card.big{font-size:16px;width:min(300px,100%);transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out;touch-action:pan-y}
.card.big .holo{animation:holo 5s ease-in-out infinite alternate}
.card.big.t-grail{animation:grail 6s linear infinite}
@keyframes holo{from{background-position:0% 0%}to{background-position:100% 100%}}
@keyframes grail{from{background-position:0% 50%}to{background-position:300% 50%}}
.cardbtn{display:block;width:100%;text-align:left;border-radius:1.1em}
.cardbtn:active .card{transform:scale(.97)}

/* Minting */
.mint{position:relative;display:grid;place-items:center;padding:6px 0 2px;perspective:900px}
.mint .burst{position:absolute;inset:6% 12%;border-radius:50%;background:radial-gradient(circle,var(--c) 0%,transparent 65%);filter:blur(22px);opacity:.5;animation:burst 1.3s ease-out backwards;pointer-events:none}
.card.minting{animation:mintin .95s cubic-bezier(.2,.9,.25,1.15) backwards}
@keyframes mintin{0%{transform:perspective(900px) rotateY(160deg) scale(.55);opacity:0}55%{opacity:1}100%{transform:perspective(900px) rotateY(0) scale(1)}}
@keyframes burst{0%{transform:scale(.3);opacity:0}40%{opacity:.9}100%{transform:scale(1);opacity:.5}}
.mint-xp{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px}
.mint-xp b{font-family:var(--display);font-size:32px;font-weight:900;line-height:1;color:var(--fire);margin-right:4px}
.mint-xp span,.kv>span.tg{font-size:12px;font-weight:800;padding:4px 8px;border-radius:6px;background:var(--soft)}
.unlock{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-lg);background:color-mix(in oklab,var(--fire) 14%,var(--surface))}
.unlock svg.i{color:var(--fire)}
.unlock b{display:block;font-size:14px}
.unlock small{color:var(--muted);font-size:12px}
.minirow{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none}
.minirow::-webkit-scrollbar{display:none}
.minirow .cardbtn{flex:none;width:128px}
.minirow .card.mini{font-size:7px}

/* Vault */
.lvlcard{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--surface);border-radius:var(--r-lg);padding:12px 14px;margin-top:6px}
.lvlcard .lv{width:58px;height:58px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--fire);color:#fff}
.lvlcard .lv b{font-family:var(--display);font-size:30px;font-weight:900;line-height:.9}
.lvlcard .lv small{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;opacity:.85}
.lvlcard .t{display:flex;flex-direction:column;gap:6px;min-width:0}
.lvlcard .t>b{font-family:var(--display);font-size:24px;font-weight:900;text-transform:uppercase;line-height:1}
.lvlcard .t small{color:var(--muted);font-size:12px;font-weight:700}
.chiprow{display:flex;gap:6px;overflow-x:auto;margin:14px -16px 0;padding:0 16px 2px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chiprow .chip{white-space:nowrap}
.tchip{box-shadow:inset 3px 0 0 var(--c)}
.tchip[aria-pressed="true"]{background:var(--c);color:#121212;box-shadow:none}
.sortrow{display:flex;justify-content:space-between;align-items:center;margin:12px 0 10px;color:var(--muted);font-size:13px;font-weight:700}
.sortrow .chip{padding:6px 10px;font-size:13px}
.vault{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px}
@media (min-width:430px){.phone .vault .card.mini{font-size:10px}}
.tiers7{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tiers7 div{background:var(--surface);border-radius:var(--r);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;border-top:3px solid var(--c)}
.tiers7 b{font-family:var(--display);font-size:24px;font-weight:900;line-height:1}
.tiers7 small{font-size:10px;font-weight:800;text-transform:uppercase;color:var(--muted)}
.bestrow{display:grid;grid-template-columns:128px 1fr;gap:14px;align-items:center}
.bestrow .card.mini{font-size:7px}
.bestrow>span{display:flex;flex-direction:column;gap:4px;min-width:0}
.bestrow>span>b:first-child{font-family:var(--display);font-size:22px;font-weight:900;text-transform:uppercase;line-height:1}
.bestrow small{color:var(--muted);font-size:13px}
.bestrow .v{font-family:var(--display);font-size:30px;font-weight:900}

/* Hunts */
.top .streak{display:inline-flex;align-items:center;gap:4px;color:var(--fire)}
.top .streak svg.i{width:16px;height:16px}
.hunt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hcard{display:flex;flex-direction:column;gap:5px;text-align:left;background:var(--surface);border-radius:var(--r-lg);padding:8px;border-top:3px solid var(--c);min-width:0}
.hcard .sil{background:var(--soft)}
.hcard .brand{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hcard .row{display:flex;flex-direction:column;gap:4px}
.hcard .row b{font-family:var(--display);font-size:20px;font-weight:900;line-height:1}
.hcard .rar{font-size:11px;padding:1px 6px}
.hcard.got{background:color-mix(in oklab,var(--c) 18%,var(--surface))}
.quests{display:flex;flex-direction:column;gap:8px}
.quest{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--surface);border-radius:var(--r-lg);padding:12px 14px}
.quest .t{display:flex;flex-direction:column;gap:6px;min-width:0}
.quest .t b{font-size:14px}
.quest .t small{color:var(--muted);font-size:12px;font-weight:700}
.quest .rew{font-family:var(--display);font-size:18px;font-weight:900;color:var(--muted);white-space:nowrap}
.quest .btn{padding:9px 12px;font-size:14px}
.quest .ok{width:30px;height:30px;border-radius:50%;background:var(--safe);color:#fff;display:grid;place-items:center}
.quest .ok svg.i{width:17px;height:17px;stroke-width:3}
.quest.done{box-shadow:inset 0 0 0 2px var(--fire)}
.quest.claimed{opacity:.7}
.quest.bonus{background:color-mix(in oklab,var(--accent) 14%,var(--surface))}
.season{display:flex;flex-direction:column;gap:10px;background:var(--surface);border-radius:var(--r-lg);padding:14px}
.season .row{display:flex;justify-content:space-between;align-items:center}
.season .row>b{font-family:var(--display);font-size:28px;font-weight:900;line-height:1}
.season small{color:var(--muted);font-size:12px;font-weight:600}
.stier{font-family:var(--display);font-size:18px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;padding:3px 10px;border-radius:6px;color:#121212}
.stier.s0{background:#C98C5A}.stier.s1{background:#C9CED6}.stier.s2{background:#F2C14E}.stier.s3{background:#9FE3E0}.stier.s4{background:linear-gradient(135deg,#9AD0FF,#E6B8FF)}
.soon{display:flex;gap:8px;align-items:flex-start;margin:0;padding-top:10px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
.soon svg.i{width:18px;height:18px;flex:none}
.trophies{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trophy{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;background:var(--surface);border-radius:var(--r-lg);padding:12px 6px 10px;min-width:0}
.trophy .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--muted)}
.trophy b{font-size:12px;line-height:1.15}
.trophy small{font-size:10.5px;color:var(--muted);line-height:1.25}
.trophy i{font-style:normal;font-size:10px;font-weight:800;color:var(--muted)}
.trophy:not(.on){opacity:.62}

.card.angelic.celest .card-name span{color:rgba(230,230,255,.8)}
.card.angelic.celest .card-foot span:first-child{color:#fff}
.card.angelic.celest .card-stats span{background:rgba(160,150,255,.12)}
.card.angelic.celest .art{background:linear-gradient(#0C0A26,#0C0A26) padding-box,var(--rbc) border-box;border-width:.18em;box-shadow:0 0 1em -.1em rgba(140,190,255,.75)}
.card.angelic.celest .art .crop{background:#0C0A26}
.card.angelic.celest .art::after{background:linear-gradient(180deg,rgba(200,220,255,.18),transparent 38%)}
.card.angelic.celest .holo{background:linear-gradient(115deg,transparent 20%,rgba(150,230,255,.5) 35%,rgba(200,170,255,.5) 48%,rgba(150,255,220,.45) 60%,transparent 75%);background-size:260% 260%;mix-blend-mode:screen;opacity:.35}
/* the star field and the aurora live behind the content */
.c-sky,.c-aurora{position:absolute;inset:0;z-index:0;border-radius:inherit;pointer-events:none}
.c-sky{background:
  radial-gradient(1px 1px at 8% 12%,#fff 99%,transparent),radial-gradient(1.5px 1.5px at 22% 6%,#fff 99%,transparent),radial-gradient(1px 1px at 37% 15%,#dfe8ff 99%,transparent),
  radial-gradient(1.5px 1.5px at 63% 9%,#fff 99%,transparent),radial-gradient(1px 1px at 78% 4%,#fff 99%,transparent),radial-gradient(1.5px 1.5px at 91% 14%,#e8dcff 99%,transparent),
  radial-gradient(1px 1px at 6% 68%,#fff 99%,transparent),radial-gradient(1.5px 1.5px at 94% 64%,#fff 99%,transparent),radial-gradient(1px 1px at 12% 88%,#dfe8ff 99%,transparent),
  radial-gradient(1px 1px at 48% 95%,#fff 99%,transparent),radial-gradient(1.5px 1.5px at 84% 90%,#fff 99%,transparent),radial-gradient(1px 1px at 70% 78%,#e8dcff 99%,transparent)}
.c-sky::after{content:"";position:absolute;inset:0;background:
  radial-gradient(2px 2px at 15% 22%,#fff 99%,transparent),radial-gradient(2px 2px at 55% 4%,#fff 99%,transparent),radial-gradient(2px 2px at 86% 30%,#fff 99%,transparent),
  radial-gradient(2px 2px at 4% 46%,#fff 99%,transparent),radial-gradient(2px 2px at 96% 82%,#fff 99%,transparent),radial-gradient(2px 2px at 30% 92%,#fff 99%,transparent);
  filter:drop-shadow(0 0 2px #fff);animation:c-twinkle 2.6s ease-in-out infinite}
@keyframes c-twinkle{0%,100%{opacity:.25}50%{opacity:1}}
.c-aurora{overflow:hidden}
.c-aurora::before,.c-aurora::after{content:"";position:absolute;left:-60%;width:220%;height:45%;filter:blur(1.1em);opacity:.75;mix-blend-mode:screen}
.c-aurora::before{top:6%;background:linear-gradient(100deg,transparent 10%,rgba(90,255,200,.55) 30%,rgba(120,200,255,.5) 45%,rgba(190,120,255,.55) 62%,transparent 85%);
  transform:skewY(-10deg);animation:c-aur 7s ease-in-out infinite alternate}
.c-aurora::after{top:52%;height:30%;background:linear-gradient(100deg,transparent 15%,rgba(190,120,255,.4) 40%,rgba(90,220,255,.4) 60%,transparent 85%);
  transform:skewY(8deg);animation:c-aur 9s -3s ease-in-out infinite alternate-reverse;opacity:.5}
@keyframes c-aur{0%{translate:-12% 0;scale:1 .8}50%{translate:6% -6%;scale:1.1 1.15}100%{translate:18% 4%;scale:.95 .9}}

.card.angelic.celest .starframe{position:absolute;inset:-.78em;z-index:-1;pointer-events:none;--st:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 20 20%27%3E%3Cpath d=%27M10 0C10.9 6.6 13.4 9.1 20 10 13.4 10.9 10.9 13.4 10 20 9.1 13.4 6.6 10.9 0 10 6.6 9.1 9.1 6.6 10 0Z%27 fill=%27%23F4F7FF%27/%3E%3C/svg%3E");border-radius:1.5em;

  animation:c-frame 3s -1.5s ease-in-out infinite;opacity:.8}

.card.mini.angelic.celest .starframe{inset:-.62em}
/* the crescent moon on top (where Grail has its halo) */
.card.angelic.celest .moon{position:absolute;top:-1.55em;left:50%;z-index:5;width:2.5em;height:2.5em;margin-left:-1.25em;border-radius:50%;pointer-events:none;
  box-shadow:inset .62em -.28em 0 0 #F3F0FF;filter:drop-shadow(0 0 .35em rgba(190,220,255,1)) drop-shadow(0 0 1em rgba(150,120,255,.9));rotate:-28deg;animation:c-moon 4s ease-in-out infinite}

/* a shooting star crosses the card now and then */
.c-shoot{position:absolute;inset:0;z-index:4;border-radius:1.1em;overflow:hidden;pointer-events:none}

@keyframes g-flap{0%,100%{transform:rotate(14deg)}50%{transform:rotate(-4deg) scale(1.06)}}
@keyframes g-flapr{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(4deg) scale(1.06)}}
.card.evo .g-aura{position:absolute;inset:-28% -40%;z-index:-3;pointer-events:none;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,236,170,.95),rgba(255,214,120,.55) 45%,rgba(255,170,220,.25) 70%,transparent);animation:g-aura 3.2s ease-in-out infinite}
@keyframes g-aura{0%,100%{opacity:.65;transform:scale(.92)}50%{opacity:1;transform:scale(1.05)}}
.card.evo .g-glint{position:absolute;inset:0;z-index:7;border-radius:1.1em;pointer-events:none;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.9),rgba(255,240,200,.35) 40%,transparent 70%);
  mix-blend-mode:soft-light;opacity:0;animation:g-glint 5s 2s ease-out infinite}
@keyframes g-glint{0%,100%{opacity:0}6%{opacity:1}22%{opacity:0}}
.card.evo .g-motes b:nth-child(3n){border-radius:0;background:#fff;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);width:calc(var(--w) * 2.6);height:calc(var(--w) * 2.6);box-shadow:none;filter:drop-shadow(0 0 3px #FFD36E)}
.card.big.evo,.mint .card.big.evo{margin-top:5.2em}
.card.big.evo .halo-ring{width:5.2em;margin-left:-2.6em}
/* the walkout opens wider for Grail: the wings spread as the card lands */
.walkout.p4 .wo-card .card.evo .wings b{animation:g-spread 1.2s .3s cubic-bezier(.2,1.4,.3,1) backwards,var(--fl) 3.2s 1.5s ease-in-out infinite}
.walkout .wo-card .card.evo .wl{--fl:g-flap}.walkout .wo-card .card.evo .wr{--fl:g-flapr}
@keyframes g-spread{from{transform:scale(.2) rotate(40deg);opacity:0}to{transform:none;opacity:1}}
/* Mythic walkout is a night sky instead of daylight clouds */

.walkout.night .wo-sky{background:radial-gradient(120% 70% at 50% 30%,#3A2A8A 0%,#1A1350 40%,#0B0824 75%,#05040F 100%)}
.walkout.night .wo-sky::after{content:"";position:absolute;inset:0;background:inherit;background:
  radial-gradient(1.5px 1.5px at 10% 14%,#fff 99%,transparent),radial-gradient(2px 2px at 28% 8%,#fff 99%,transparent),radial-gradient(1px 1px at 44% 22%,#fff 99%,transparent),
  radial-gradient(2px 2px at 70% 12%,#fff 99%,transparent),radial-gradient(1.5px 1.5px at 88% 24%,#fff 99%,transparent),radial-gradient(1px 1px at 6% 56%,#fff 99%,transparent),
  radial-gradient(2px 2px at 92% 60%,#fff 99%,transparent),radial-gradient(1.5px 1.5px at 18% 84%,#fff 99%,transparent),radial-gradient(1px 1px at 60% 90%,#fff 99%,transparent),
  radial-gradient(2px 2px at 82% 86%,#fff 99%,transparent),radial-gradient(1px 1px at 36% 64%,#fff 99%,transparent),radial-gradient(1.5px 1.5px at 54% 40%,#fff 99%,transparent);
  animation:c-twinkle 3s ease-in-out infinite}
.walkout.night .wo-rays{background:repeating-conic-gradient(from 0deg,rgba(170,210,255,.45) 0 4deg,rgba(255,255,255,0) 4deg 15deg)}
.walkout.night .wo-hint small,.walkout.night .wo-tap{color:#A9A3D9}
.walkout.night .rb{background:linear-gradient(90deg,#9FE8FF,#E4DCFF,#FFFFFF,#9FE3D6,#C9B8FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.walkout.night .wo-cloud{filter:drop-shadow(0 0 22px rgba(120,90,255,.6))}
.walkout.night .wo-cloud.l,.walkout.night .wo-cloud.r{background:var(--puff) 70% 8%/180px 150px no-repeat,var(--puff) 95% 30%/220px 190px no-repeat,var(--puff) 75% 55%/200px 170px no-repeat,var(--puff) 98% 78%/230px 200px no-repeat,var(--puff) 60% 96%/200px 170px no-repeat,linear-gradient(90deg,#2A1E66 55%,rgba(42,30,102,0) 80%)}
.walkout.night .wo-cloud.b{background:var(--puff) 10% 40%/240px 170px no-repeat,var(--puff) 50% 20%/300px 200px no-repeat,var(--puff) 90% 40%/240px 170px no-repeat,linear-gradient(rgba(42,30,102,0),#2A1E66 60%)}
.walkout.night .wo-flash{background:radial-gradient(circle at 50% 45%,#fff,rgba(190,220,255,.8) 40%,rgba(120,90,255,0) 75%)}

.walkout.p4 .wo-card .card.celest .moon{animation:wo-halo 1.3s .5s cubic-bezier(.2,1.3,.3,1) backwards,c-moon 4s 1.8s ease-in-out infinite}
/* a shockwave ring as an angelic card lands */
.wo-ring{position:absolute;left:50%;top:46%;width:40px;height:40px;margin:-20px;border-radius:50%;border:3px solid rgba(255,214,120,.9);opacity:0;pointer-events:none;z-index:2}
.walkout.night .wo-ring{border-color:rgba(170,220,255,.9)}
.walkout.p4 .wo-ring{animation:wo-ring 1.1s .15s ease-out forwards}.walkout.p4 .wo-ring.r2{animation-delay:.4s}
@keyframes wo-ring{0%{opacity:1;transform:scale(.5)}100%{opacity:0;transform:scale(16)}}
.walkout.p4.shake{animation:wo-shake .45s .1s}
@keyframes wo-shake{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-3px,2px)}80%{transform:translate(2px,-1px)}}
@media (prefers-reduced-motion:reduce){.card.celest,.card.celest *,.card.celest *::before,.card.celest *::after,.card.angelic .orbit,.card.angelic .prism,.card.evo .wings b,.card.evo .g-aura,.card.evo .g-glint{animation:none!important}.c-shoot,.card.angelic .orbit,.card.evo .g-glint{display:none}}

/* Look: warm black, bone white and one safety orange. Square-ish corners (6px), thin lines instead of glows, no gradients
   on the interface, and motion only where something happens (a card mints, a sheet opens, the 3D model turns). */
.phone{--hot:#FF5A2E;--mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,monospace}
.screen,.cam{z-index:1}
/* Headings: plain ink, orange full stop */
.top h1 span{color:var(--hot)}
/* Panels: flat, with a hairline edge */
.lvlcard,.stats>div,.quest,.season,.setting,.bcard,.trophy,.hcard,.want,.dexhead,.emptybox,.info,.tiers7 div,.pts-table{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:6px}
.lvlcard .lv{background:var(--hot);color:#fff;border-radius:6px}
/* Numbers read like a price tag */
.stats b,.lvlcard .t small,.mint-xp b,.card-stats b,.v3d-name .v,.plan .price,.quest .rew,.season .row>b,.ptspill b{font-variant-numeric:tabular-nums}
.lvlcard .t small,.quest .t small,.season small,.sortrow>span,.top small{font-family:var(--mono);font-size:11.5px;letter-spacing:.02em;text-transform:uppercase}
/* Progress bars: one solid colour */
.prog i{background:var(--hot)!important}
/* Buttons: solid, 6px corners, a small press */
.btn,.chip,.cardbtn,.bcard,.hcard,.want,.dexp,.btn3d,.plan{transition:transform .12s ease-out,background-color .15s}
.btn:active,.chip:active,.bcard:active,.hcard:active,.want:active,.dexp:active,.btn3d:active,.plan:active{transform:scale(.97)}
.btn{border-radius:6px}
.btn.hot{background:var(--hot);color:#fff}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
/* Tab bar: an orange line over the open tab */
.tab[aria-current="page"]::before{content:"";position:absolute;top:-7px;left:50%;width:28px;height:2px;margin-left:-14px;background:var(--hot)}
.tab.scan svg{color:var(--hot)}
/* Shutter: plain white ring */
.shutter{border-color:#fff!important}
/* 3D badge on the card art and on mini cards */
.art3d{position:absolute;right:.5em;bottom:.5em;z-index:4;display:inline-flex;align-items:center;gap:.3em;padding:.35em .6em .35em .45em;border-radius:.4em;background:rgba(12,12,12,.72);color:#fff;font-family:var(--display);font-size:1em;font-weight:900;letter-spacing:.06em;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.art3d svg.i{width:1.15em;height:1.15em}
.has3d{position:absolute;right:.45em;top:.45em;z-index:4;width:2.3em;height:2.3em;border-radius:.35em;display:grid;place-items:center;background:rgba(12,12,12,.7);color:#fff}
.has3d svg.i{width:1.4em;height:1.4em}
.btn3d{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:6px;text-align:left;color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.btn3d>svg.i{width:34px;height:34px;padding:6px;border-radius:6px;background:var(--hot);color:#fff;flex:none}
.btn3d span{display:flex;flex-direction:column;min-width:0}
.btn3d b{font-size:16px}
.btn3d small{font-size:12.5px;font-weight:600;color:var(--muted)}
.btn3d.made>svg.i{background:var(--ink);color:var(--bg)}
/* Looking for or making a model */
.m3dmake{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:8px 0}
.m3dorb{position:relative;width:150px;height:150px;display:grid;place-items:center}
.m3dorb .crop3d{position:relative;width:120px;height:120px;border-radius:8px;overflow:hidden;box-shadow:0 0 0 2px var(--c)}
.m3dorb .crop3d .crop{position:absolute;inset:0}
.m3dorb .crop3d img{width:100%;height:100%;object-fit:cover}
.m3dorb i{display:none}
.m3dorb i:first-of-type{display:block;position:absolute;left:15px;right:15px;bottom:6px;height:3px;background:var(--line);overflow:hidden}
.m3dorb i:first-of-type::after{content:"";position:absolute;top:0;bottom:0;width:30%;background:var(--hot);animation:scanbar 1.1s ease-in-out infinite alternate}
@keyframes scanbar{from{left:0}to{left:70%}}
.m3dmake>b{font-size:17px}
.m3dmake small{color:var(--muted);font-size:13px;max-width:280px}
.m3dbar{width:100%;max-width:280px;height:4px;background:var(--soft);overflow:hidden}
.m3dbar i{display:block;height:100%;width:3%;background:var(--hot);transition:width .4s ease}
/* Viewer: the model sits in a card-shaped stage edged in its rarity colour. Sketchfab's own bars are clipped off and its loading screen sits behind Summu's. */
.v3d{position:absolute;inset:0;z-index:30;color:#F2EFEA;background:#0C0C0C;display:flex;flex-direction:column;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(14px + env(safe-area-inset-bottom,0px));animation:fadein .2s ease-out;overflow:hidden}
.v3d-bg{display:none}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.v3d>*{position:relative}
.v3d-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.v3d-top .tag3d{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.v3d-top .tag3d svg.i{width:22px;height:22px;color:var(--hot)}
.v3d-top .x{width:40px;height:40px;border-radius:6px;background:#1C1C1B;font-size:24px;line-height:1;color:#F2EFEA;box-shadow:inset 0 0 0 1px #2F2E2C}
.v3d-frame{flex:1;min-height:0;border-radius:10px;padding:2px;background:var(--c)}
.v3d-stage{position:relative;height:100%;border-radius:8px;overflow:hidden;touch-action:none;background:radial-gradient(80% 60% at 50% 42%,#222120,#121212 75%)}
.v3d-stage iframe{position:absolute;left:0;top:-64px;width:100%;height:calc(100% + 128px);border:0;background:transparent;color-scheme:light;opacity:0;transition:opacity .4s ease}
.v3d-stage.ready iframe{opacity:1}
.v3d-tier{position:absolute;left:10px;top:10px;z-index:2;pointer-events:none}
.v3d-load{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .4s ease;pointer-events:none}
.v3d-stage.ready .v3d-load{opacity:0}
.v3d-load .orb{position:relative;width:130px;height:130px;display:grid;place-items:center}
.v3d-load .orb .crop{width:104px;height:104px;border-radius:8px;box-shadow:0 0 0 2px var(--c)}
.v3d-load .orb i{display:none}
.v3d-load .orb i:first-of-type{display:block;position:absolute;left:13px;right:13px;bottom:0;height:3px;background:#2F2E2C;overflow:hidden}
.v3d-load .orb i:first-of-type::after{content:"";position:absolute;top:0;bottom:0;width:30%;background:var(--hot);animation:scanbar 1.1s ease-in-out infinite alternate}
.v3d-load b{font-weight:800;font-size:14px;color:#A19D96}
.v3d-hint{position:absolute;left:50%;bottom:12px;z-index:2;transform:translateX(-50%);white-space:nowrap;padding:6px 10px;border-radius:6px;background:rgba(12,12,12,.75);font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.03em;pointer-events:none;opacity:0;transition:opacity .4s}
.v3d-stage.ready .v3d-hint{opacity:1;animation:hintaway .6s ease 4s forwards}
@keyframes hintaway{to{opacity:0}}
.v3d-name{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.v3d-name>span{min-width:0}
.v3d-name b{display:block;font-family:var(--display);font-weight:900;font-size:32px;line-height:.95;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v3d-name small{display:block;margin-top:3px;font-weight:600;font-size:14px;color:#A19D96;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v3d-name .v{flex:none;font-family:var(--display);font-weight:900;font-size:28px;line-height:1;color:#F2EFEA}
.v3d-new{margin:0;text-align:center;font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:#A19D96}
.v3d-new svg.i{display:none}
.v3d .row2{margin:0}
.v3d .btn.ghost{background:#1C1C1B;color:#F2EFEA;box-shadow:inset 0 0 0 1px #2F2E2C}
.v3d-credit{margin:-4px 0 0;text-align:center;font-size:11px;font-weight:600;color:#6B6760;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v3d-credit a{color:inherit}
.v3d-plain{margin:-4px 0 0;text-align:center;font-size:12.5px;font-weight:700;color:#A19D96}
/* Out of free models */
.m3dout{display:flex;align-items:center;gap:14px}
.m3dout .ring{flex:none;width:72px;height:72px;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.m3dout .ring b{font-family:var(--display);font-size:30px;line-height:1}
.m3dout .ring small{font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase}
.plan{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:14px;border-radius:6px;text-align:left;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.plan span:first-child{display:flex;flex-direction:column;min-width:0}
.plan b{font-size:16px}
.plan small{color:var(--muted);font-size:12.5px;font-weight:600}
.plan.plus{background:#141414;color:#F2EFEA;box-shadow:inset 0 0 0 1px #FFB23E}
.plan.plus b{color:#FFB23E;font-family:var(--display);font-size:24px;letter-spacing:.03em;text-transform:uppercase}
.plan.plus small{color:#A19D96}
.plan .price,.plan .tagfree{flex:none;font-family:var(--mono);font-size:11px;text-transform:uppercase;padding:5px 8px;border-radius:4px;box-shadow:inset 0 0 0 1px currentColor}
.plan .tagfree{color:var(--uncommon)}
.m3drow .meter{flex:none;width:80px;height:4px;background:var(--soft);overflow:hidden}
.m3drow .meter i{display:block;height:100%;background:var(--hot)}
/* Confetti when a card is minted, in the card's colour */
.mint{position:relative}
.confetti{position:absolute;left:50%;top:42%;width:0;height:0;z-index:6;pointer-events:none}
.confetti i{position:absolute;width:6px;height:10px;opacity:0;animation:conf var(--d) cubic-bezier(.15,.7,.3,1) forwards}
@keyframes conf{0%{opacity:1;transform:translate(0,0) rotate(0) scale(.6)}70%{opacity:1}100%{opacity:0;transform:translate(var(--x),calc(var(--y) + 120px)) rotate(var(--r)) scale(1)}}
/* Small shapes: tags and chips are 4-6px, never pills */
.ptspill,.pillmsg,.scanning .chip,.scanning .chip button,.statusbox button,.zoom,.zoom button,.fixbtn,.rar,.chip,.tchip,.kv>span,.mint-xp span,.stier,.pill,.chips span,.found .chip{border-radius:5px!important}
.sheet{border-radius:12px 12px 0 0;box-shadow:0 -1px 0 var(--line)}
.lastcard .crop{display:block}
.lastcard{border-radius:6px}
/* Legal pages inside the app */
.legal h4{margin:14px 0 4px;font-size:15px}
.legal p,.legal li{margin:0 0 8px;color:var(--muted);font-size:14px;line-height:1.5}
.legal ul{margin:0 0 8px;padding-left:18px}
.legal small{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase}
.links{display:flex;gap:16px;justify-content:center;margin-top:10px}
.links a{font-size:13px;font-weight:700;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
@media (prefers-reduced-motion:reduce){ .m3dorb i::after,.v3d-load .orb i::after,.confetti i{animation:none!important} }

/* Natural: looks like a normal phone app (Instagram, Depop, Vinted). The phone's own font, sentence case, the phone's own
   greys, grouped rows with soft corners, one orange for the main button. Only the trading cards keep the poster font. */
.phone{--display:var(--body);--body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --bg:#000;--surface:#1C1C1E;--raise:#2C2C2E;--soft:#1C1C1E;--ink:#F5F5F7;--muted:#8E8E93;--line:#2C2C2E;--accent:#F5F5F7;--accent-ink:#000;--r:12px;--r-lg:14px;
  font-family:var(--body);letter-spacing:-.005em}
.phone[data-look="light"]{--bg:#F2F2F7;--surface:#FFFFFF;--raise:#E5E5EA;--soft:#E5E5EA;--ink:#000;--muted:#6C6C70;--line:#D8D8DC;--accent:#000;--accent-ink:#fff}
.card,.card *{--display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif}
body{padding:0;gap:0}
.phone{border-radius:0;box-shadow:none;height:100%;min-height:0}
@media (min-width:521px){.phone{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
/* Text: sentence case, normal weights */
h1,h2,h3,.section-title,.brand,.emptybox b,.lvlcard .t>b,.bestrow>span>b:first-child,.stats b.tname,.wordmark,.logo,.rar,.v3d-top .tag3d,.v3d-name b,.plan.plus b,.how b{text-transform:none!important;letter-spacing:-.015em}
h1,h2,h3{font-weight:700;line-height:1.1}
.top{padding:14px 0 8px;align-items:baseline}
.top h1{font-size:30px}
.top h1 span{display:none}
.top small{font-weight:500;font-size:13px}
.section-title{font-size:20px;font-weight:700;margin:26px 0 10px}
.section-title small{font-size:13px;font-weight:400}
.brand{font-weight:600;font-size:14px;letter-spacing:0}
.stats b,.dexhead .nums b,.tiers7 b,.bestrow .v,.want b,.dexp b,.hcard .row b,.quest .rew,.pts-table b,.lvlcard .lv b,.mint-xp b,.m3dout .ring b,.emptybox b{font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stats b{font-size:22px}

.dexhead .nums b{font-size:28px}
.hcard .row b,.want b{font-size:17px}
.quest .rew{font-size:15px;color:var(--muted)}
.mint-xp b{font-size:26px}
.bestrow .v{font-size:26px}
.rar{font-weight:600;font-size:12px;letter-spacing:0;padding:2px 7px;border-radius:6px!important}
.emptybox b{font-size:20px}
/* Level: a plain number badge, not a loud orange block */
.lvlcard .lv{background:var(--raise);color:var(--ink);border-radius:12px}
.lvlcard .lv b{font-size:24px}
.lvlcard .t>b{font-size:18px;font-weight:700}
.lvlcard .t small{font-family:var(--body);text-transform:none;font-size:13px;letter-spacing:0}
/* Panels: grouped rows like the phone's Settings */
.lvlcard,.stats>div,.quest,.season,.bcard,.trophy,.hcard,.want,.dexhead,.pts-table,.info,.tiers7 div,.how div,.unlock{box-shadow:none!important;border-radius:var(--r-lg)}
.quest.done{box-shadow:inset 0 0 0 1.5px var(--fire)!important}
.quest.bonus{background:var(--surface)}
.unlock{background:var(--surface)}
.setting{border-bottom:.5px solid var(--line)}
.prog{border-radius:3px}
.prog i{border-radius:3px}
/* Buttons */
.btn{border-radius:12px;font-weight:600;font-size:16px;text-transform:none;letter-spacing:0}
.btn.ghost{background:var(--raise);color:var(--ink);box-shadow:none}
.chip{border-radius:9px!important;font-weight:600;font-size:14px;background:var(--raise)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.mint-xp span{border-radius:7px!important;font-weight:600}
.btn3d{background:var(--surface);box-shadow:none;border-radius:14px}

.btn3d b{font-weight:600}
/* Tab bar: plain icons and labels, the open one in white */
.tabs{background:var(--bg);border-top:.5px solid var(--line)}
.tab{font-size:10.5px;font-weight:500;letter-spacing:0}
.tab[aria-current="page"]::before{display:none}
.tab.scan svg{color:inherit}
.phone[data-tab="scan"] .tabs{background:#000;border-top-color:#1C1C1E}
/* Camera */
.cam,.vf{background:#000}
.vf{border-radius:0 0 18px 18px}
.logo{font-family:var(--body);font-weight:700;font-size:22px;letter-spacing:-.02em}
.logo span{display:none}
.ptspill{font-family:var(--body);font-weight:600;border-radius:10px!important;background:rgba(0,0,0,.55)}
.ptspill b{font-family:var(--body);font-size:15px}
.pillmsg{font-weight:500;border-radius:10px!important;background:rgba(0,0,0,.55)}
.zoom{border-radius:12px!important;background:rgba(0,0,0,.5)}
.zoom button{border-radius:9px!important;font-weight:600}
/* Sheets */
.sheet{border-radius:14px 14px 0 0;box-shadow:none}
.sheet-head h3{font-size:22px}
/* Welcome */
.onb-body{padding:40px 20px 16px;gap:18px}
.wordmark{font-family:var(--body);font-size:22px;font-weight:700;line-height:1;color:var(--muted)}
.wordmark span{display:none}
.onb-body h2{font-size:34px;line-height:1.05;letter-spacing:-.03em}
.onb-body p{font-size:16px}
.how{gap:8px}
.how div{background:var(--surface)}
.how i{background:var(--raise);border-radius:10px}
.how b{font-size:16px}
.tierline{display:none}
/* 3D viewer */
.v3d{background:#000}
.v3d-top .tag3d{font-family:var(--body);font-size:18px;font-weight:700}
.v3d-name b{font-family:var(--body);font-size:24px;font-weight:700;line-height:1.1}
.v3d-name .v{font-family:var(--body);font-size:22px;font-weight:700}
.v3d-new{font-family:var(--body);text-transform:none;font-size:13px;letter-spacing:0}
.v3d-hint{font-family:var(--body);text-transform:none;font-size:12px;letter-spacing:0;border-radius:10px}
.v3d-frame{border-radius:16px}
.v3d-stage{border-radius:14px}
/* No typewriter labels */
.phone{--mono:var(--body)}
.lvlcard .t small,.quest .t small,.season small,.sortrow>span,.top small,.legal small,.m3dout .ring small,.plan .price,.plan .tagfree,.stier,.v3d-new{font-family:var(--body)!important;text-transform:none!important;letter-spacing:0!important;font-size:13px}
.quest .t small,.sortrow>span{font-size:12.5px;font-weight:500}
.stier{font-weight:700;font-size:15px;border-radius:8px!important}
.profile .av{background:var(--raise)!important;color:var(--muted)!important}
.profile h2{font-size:28px}
.setting{background:none!important;box-shadow:none!important;border-radius:0!important;border-bottom:.5px solid var(--line)}

/* Angelic: warm cream and gold by day, warm candlelight by night. Soft serif titles (Fraunces), a sunrise glow at the top
   of every page, and a thin pastel rainbow on the small things: the open tab, progress, the shutter halo, the level halo. */
@font-face{font-family:"Fraunces";font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/fraunces-latin.woff2) format("woff2-variations")}
@font-face{font-family:"Fraunces";font-style:italic;font-display:swap;font-weight:100 900;src:url(fonts/fraunces-latin-italic.woff2) format("woff2-variations")}
.phone{--serif:"Fraunces",Georgia,"Times New Roman",serif;
  --rainbow:linear-gradient(90deg,#FFB3A7,#FFD3A1,#FBEA9C,#C5E8B7,#AFD8F2,#CDBEF0,#F6B6D2);
  --halo:conic-gradient(from 200deg,#FFB3A7,#FFD3A1,#FBEA9C,#C5E8B7,#AFD8F2,#CDBEF0,#F6B6D2,#FFB3A7);
  --fire:#EE8456;--hot:#EE8456;--gold:#C9963A;
  --bg:#1A1310;--surface:#251B16;--raise:#33261F;--soft:#2B201A;--ink:#FBEFE2;--muted:#B39B87;--line:#3A2C24;--accent:#FBEFE2;--accent-ink:#1A1310;
  --glow:rgba(255,190,120,.16);--shadow:0 10px 28px -18px rgba(0,0,0,.8)}
.phone[data-look="light"]{--bg:#FCF6EE;--surface:#FFFDF9;--raise:#F6ECDF;--soft:#F8F0E6;--ink:#3B2B20;--muted:#9A8472;--line:#EFE2D1;--accent:#3B2B20;--accent-ink:#FFFDF9;
  --fire:#E9794A;--hot:#E9794A;--gold:#B9852C;--glow:rgba(255,196,128,.45);--shadow:0 12px 30px -20px rgba(140,90,40,.45)}
body{background:var(--bg)}
/* A sunrise glow behind the top of each page */
.screen{background:radial-gradient(120% 340px at 50% -60px,var(--glow),transparent 70%) no-repeat,var(--bg)}
.onb{background:radial-gradient(140% 460px at 50% -80px,var(--glow),transparent 72%) no-repeat,var(--bg)}
/* Titles: soft serif */
h1,h2,h3,.section-title,.wordmark,.logo,.lvlcard .t>b,.bestrow>span>b:first-child,.emptybox b,.v3d-name b{font-family:var(--serif);font-weight:560;letter-spacing:-.01em}
.top{padding:18px 0 10px}
.top h1{font-size:34px;font-style:italic;font-weight:500}
.top small{color:var(--muted)}
.section-title{font-size:22px;margin:28px 0 12px;position:relative;padding-bottom:9px}
.section-title::after{content:"";position:absolute;left:0;bottom:0;width:34px;height:3px;border-radius:3px;background:var(--rainbow)}
.section-title small{font-family:var(--body)}
.profile h2,.sheet-head h3{font-family:var(--serif);font-weight:560}
.sheet-head h3{font-size:24px}
/* Panels: soft paper with a warm shadow */
.lvlcard,.stats>div,.quest,.season,.bcard,.trophy,.hcard,.want,.dexhead,.pts-table,.info,.tiers7 div,.how div,.unlock,.btn3d,.emptybox{background:var(--surface);border-radius:18px!important;box-shadow:var(--shadow),inset 0 0 0 1px var(--line)!important}
.emptybox{border:0}
.setting{border-bottom:1px solid var(--line)}
/* Level and avatar wear a rainbow halo */
.lvlcard .lv{position:relative;border-radius:50%;width:58px;height:58px;background:var(--surface);color:var(--ink);box-shadow:0 0 0 3px var(--surface),0 0 18px -2px rgba(255,200,140,.55)}
.lvlcard .lv::before{content:"";position:absolute;inset:-3px;border-radius:50%;padding:3px;background:var(--halo);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.lvlcard .lv b{font-family:var(--serif);font-weight:600}
.profile .av{position:relative;background:var(--surface)!important;color:var(--gold)!important;box-shadow:0 0 30px -4px rgba(255,200,140,.6)}
.profile .av::before{content:"";position:absolute;inset:-4px;border-radius:50%;padding:3px;background:var(--halo);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
/* Progress fills with the rainbow */
.prog{height:6px;border-radius:6px;background:var(--raise)}
.prog i{background:var(--rainbow)!important;border-radius:6px}
.m3drow .meter i{background:var(--rainbow)}
/* Buttons: warm and rounded, with a soft glow on the main one */
.btn{border-radius:16px}
.btn.hot{background:var(--fire);color:#fff;box-shadow:0 10px 24px -12px var(--fire)}
.btn.ghost{background:var(--raise);color:var(--ink)}
.chip{border-radius:12px!important;background:var(--raise)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.rar{border-radius:8px!important}
.quest.done{box-shadow:var(--shadow),inset 0 0 0 1.5px var(--fire)!important}
.quest .ok{background:var(--gold)}
.trophy.on .ic{background:linear-gradient(150deg,#FFE7A8,#E7B04E);color:#5A3A00}
/* Tab bar: warm frosted, the open tab gets a rainbow line */
.tabs{background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tab{position:relative}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"]::before{display:block!important;content:"";position:absolute;top:-6px;left:50%;width:26px;height:3px;margin-left:-13px;border-radius:3px;background:var(--rainbow)}
.phone[data-tab="scan"] .tabs{background:#120D0A;border-top-color:#2A1F19}
/* Camera: a rainbow halo around the shutter */
.cam,.controls{background:#120D0A}
.logo{font-style:italic;font-weight:500;font-size:24px}
.shutter{position:relative;border-color:#FFF8EE!important;box-shadow:0 0 26px -2px rgba(255,205,150,.45)}
.shutter::before{content:"";position:absolute;inset:-8px;border-radius:50%;padding:3px;background:var(--halo);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.9}
.shutter span{background:#FFF8EE}
.ptspill,.pillmsg{background:rgba(26,19,16,.6)!important;color:#FBEFE2}
.zoom{background:rgba(26,19,16,.55)!important}
/* Sheets open with a rainbow edge */
.sheet{border-radius:24px 24px 0 0;overflow:hidden}
.sheet::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--rainbow);z-index:2}
/* Welcome */
.wordmark{font-style:italic;font-weight:500;font-size:26px;color:var(--gold)}
.wordmark::after{content:" ✦";font-style:normal;font-size:.7em;vertical-align:.25em}
.onb-body h2{font-size:40px;line-height:1.02;font-weight:520;letter-spacing:-.02em}
.how i{background:var(--raise);color:var(--gold);border-radius:12px}
/* The mint glow uses the card's own colour, softly */
.mint .burst{opacity:.35}
/* Light look: legal links and small text stay readable */
.phone[data-look="light"] .links a,.phone[data-look="light"] .empty{color:var(--muted)}
.profile .av svg.i{color:var(--gold);stroke:var(--gold)}
/* The scanning pill sits on the photo, so it keeps light text in both looks */
.scanning .chip,.scanning .chip button{color:#FBEFE2!important}
.scanning .chip{background:rgba(26,19,16,.74)!important}
.scanning .chip button{background:rgba(255,248,238,.16)!important}

</style>
</head>
<body>
<div class="phone" id="phone" data-look="dark" data-tab="scan">
  <section class="cam" id="cam" aria-label="Camera">
    <div class="vf" id="vf">
      <video id="vid" playsinline muted autoplay hidden></video>
      <img id="still" class="still" alt="" hidden>
      <div id="nolive" class="nolive" hidden></div>
      <div class="cam-top"><span class="logo">Summu<span>.</span></span><button class="ptspill" id="ptspill" data-tab="me"></button></div>
      <div class="frame" id="frame" hidden><i class="c a"></i><i class="c b"></i><i class="c d"></i><i class="c e"></i></div>
      <div class="vf-msg" id="vfmsg"></div>
      <div class="zoom" id="zoom" role="group" aria-label="Zoom" hidden></div>
      <div class="scanning" id="scanning" hidden><i class="line"></i><span class="chip"><span id="scanmsg">Identifying…</span> <button data-act="scanstop">Cancel</button></span></div>
    </div>
    <div class="controls">
      <button class="lastcard" id="lastspot" data-tab="vault" aria-label="Your last card, in the Vault"><span class="ico" id="lastthumb"></span></button>
      <button class="shutter" id="shutter" data-act="shoot" aria-label="Open the camera"><span></span></button>
      <button class="flipcam" id="flipcam" data-act="flip" aria-label="Switch to the selfie camera" hidden><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v12H4z"/><path d="M8.6 13.2a3.4 3.4 0 0 1 6-2.1"/><path d="M15.4 13.8a3.4 3.4 0 0 1-6 2.1"/><path d="M14.8 8.9v2.4h-2.4"/><path d="M9.2 18.1v-2.4h2.4"/></svg></button>
    </div>
  </section>
  <main class="screen" id="screen"></main>
  <nav class="tabs" aria-label="Sections">
    <button class="tab" data-tab="vault"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="3" width="13" height="17" rx="2"/><path d="M4 7v12a2 2 0 0 0 2 2h9"/></svg>Vault</button>
    <button class="tab" data-tab="dex"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 12h16"/><circle cx="12" cy="12" r="2.6"/></svg>Dex</button>
    <button class="tab scan" data-tab="scan"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v12H4z"/><circle cx="12" cy="13.5" r="3.5"/></svg>Scan</button>
    <button class="tab" data-tab="hunts"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".9"/></svg>Hunts<i class="dot" id="huntdot" hidden></i></button>
    <button class="tab" data-tab="me"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Me</button>
  </nav>
  <div id="overlay"></div>
  <div id="onb"></div>
</div>
